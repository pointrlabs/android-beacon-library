// Pointr's build of AltBeacon (master after 2.21.1), the module :altbeacon of core-android-sdk. It replaces
// org.altbeacon:android-beacon-library in :PointrSDK and is released as com.pointrlabs:altbeacon
// (altbeacon-release.gradle), before core. Pointr's changes to the library are listed in POINTR.md.
plugins {
    id 'com.android.library'
    id 'kotlin-android'
}

group = 'com.pointrlabs'
version = '2.21.1-pointr.1'

android {
    compileSdk 37
    namespace 'org.altbeacon.beacon'

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        minSdkVersion 28
        targetSdkVersion 37
        consumerProguardFiles "consumer-rules.pro"
        buildConfigField "String", "VERSION_NAME", "\"${version}\""
    }

    // AltBeacon's own tests need its own build (Robolectric 4.11, Mockito 2); they are not built here
    sourceSets {
        test.java.srcDirs = []
        test.resources.srcDirs = []
        androidTest.java.srcDirs = []
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    lint {
        abortOnError false
    }
}

// The same Kotlin as :PointrSDK, so that host apps on Kotlin 1.9 and later still compile against it
kotlin {
    coreLibrariesVersion = '2.0.20'
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11)
        languageVersion.set(org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_2_0)
        apiVersion.set(org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_2_0)
    }
}

dependencies {
    // The dependencies of org.altbeacon:android-beacon-library
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-process:2.6.2'
}

// Third-party code: left out of Pointr's SonarCloud analysis
sonar {
    skipProject = true
}

apply from: rootProject.file('altbeacon-release.gradle')
